spring:
  application:
    name: ledgermate
  config:
    # Lets beginners keep all settings in a single ".env" file (KEY=VALUE per line).
    # Looked up in the backend folder first, then in the project root.
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgermate}
    username: ${DB_USERNAME:ledgermate}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # schema is owned by Flyway migrations only
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-issuer: ledgermate
    token-ttl-minutes: ${JWT_TTL_MINUTES:120}
    cookie-name: LM_AUTH
    cookie-secure: ${COOKIE_SECURE:false}
    expose-token-in-response: ${EXPOSE_TOKEN_IN_RESPONSE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_PASSWORD:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ledgermate: INFO
